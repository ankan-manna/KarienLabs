name: medcommerce

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/html/error-pages:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks: [medcommerce]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
    networks: [medcommerce]

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file:
      - ../../.env
    # apps/api/Dockerfile's HEALTHCHECK curls its own HTTP server on :5000 —
    # correct for the `api` service, but `worker` runs the exact same image
    # with no HTTP server at all (it's a background BullMQ job processor),
    # so that healthcheck always fails here. Without disabling it, `docker
    # compose ps`/`docker ps` permanently shows this container as
    # "unhealthy" even when it's working correctly, which is actively
    # misleading for monitoring/alerting.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    networks: [medcommerce]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [medcommerce]

volumes:
  redis-data:

networks:
  medcommerce:
    driver: bridge
