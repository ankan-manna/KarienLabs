name: medcommerce-prod

# Shared log rotation policy — Container Logs / Log Rotation spec item.
# Applied per-service below since Compose doesn't support a single
# `x-` anchor from *outside* the file being referenced across a multi-file
# `-f a.yml -f b.yml` merge in every Compose version; duplicating a small
# block per service is more portable than relying on that.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    volumes:
      - ../nginx/certs:/etc/nginx/certs:ro
      - ../nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro # only present once init-letsencrypt.sh has run and you've copied ssl.conf.example -> ssl.conf
      - ../nginx/certbot-webroot:/var/www/certbot:ro
      # Bind-mounted (not just the json-file driver) so Fail2Ban, which runs
      # directly on the host, can tail these — see infra/security/jail.local.
      - /var/log/medcommerce/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    logging: *default-logging
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 5

  worker:
    logging: *default-logging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G


  redis:
    # Production Redis: password-protected, AOF persistence so a container
    # restart doesn't lose queued notification/invoice jobs. REDIS_PASSWORD
    # must match the password embedded in REDIS_URL (.env.production.example).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Renews Let's Encrypt certificates every 12h (certbot no-ops if the cert
  # isn't within its renewal window yet) and reloads nginx after a successful
  # renewal. Only useful once init-letsencrypt.sh has issued the first
  # certificate — safe to leave running unconditionally otherwise (it just
  # finds nothing to renew).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ../nginx/certs:/etc/letsencrypt
      - ../nginx/certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks: [medcommerce]
    logging: *default-logging
