name: medcommerce-dev

services:
  api:
    build:
      target: build
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages/shared:/app/packages/shared
      - /app/apps/api/node_modules
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      target: build
    command: ["npx", "tsx", "watch", "src/worker.ts"]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages/shared:/app/packages/shared
      - /app/apps/api/node_modules
    environment:
      NODE_ENV: development
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      dockerfile: apps/web/Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages/shared:/app/packages/shared
      - /app/apps/web/node_modules
    ports:
      - "5173:5173"

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks: [medcommerce]

  # RUNBOOK — local S3-compatible object storage (no AWS account required).
  # Backs invoice PDFs, shipping/return labels, and archived log bundles via
  # the SAME apps/api/src/integrations/s3/* abstraction used for real AWS S3
  # in staging/production — only AWS_S3_ENDPOINT (see .env) differs.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [medcommerce]

  # One-shot bucket bootstrap — runs `mc mb --ignore-existing` so it's safe
  # to re-run on every `docker compose up` (idempotent, never errors if the
  # bucket already exists). `api`/`worker` wait on this completing
  # successfully before starting, so the bucket always exists before the
  # app's first upload attempt.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${AWS_S3_BUCKET:-medcommerce-local} &&
      mc anonymous set none local/${AWS_S3_BUCKET:-medcommerce-local} &&
      echo 'MinIO bucket ready: ${AWS_S3_BUCKET:-medcommerce-local}'
      "
    networks: [medcommerce]

volumes:
  minio-data:
