user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $request_time [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Log rotation is handled by the host (logrotate, see infra/scripts notes) or
  # the Docker json-file log driver's max-size/max-file options — see
  # docker-compose.prod.yml's `logging:` block on each service.

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml
             application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Brotli gives a meaningfully smaller payload than gzip for JS/CSS but isn't
  # compiled into the stock nginx:alpine image — swap the nginx image for
  # `nginx:1.27-alpine` -> a custom build with the brotli module (or
  # `fholzer/nginx-brotli`) to enable; left commented so this config keeps
  # working out of the box on the stock image.
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

  include /etc/nginx/conf.d/*.conf;
}
