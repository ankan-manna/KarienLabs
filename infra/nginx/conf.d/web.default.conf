# HTTP-only reverse proxy for the storefront/admin frontend (the `web`
# container — a static Dockerized build of apps/web, served internally by
# its own nginx per apps/web/Dockerfile + conf.d/spa.conf). Mirrors
# default.conf's pattern for the `api` service exactly, just for the web
# subdomain — see that file's comment and infra/nginx/conf.d/ssl.conf.example
# §"Subdomain variant" for why this repo uses api.<domain> + www.<domain>
# (two subdomains, two server blocks) rather than one domain with path-based
# routing. Works standalone before any TLS certificate exists (step 6 of the
# deployment guide); web.ssl.conf.example adds the HTTPS listener on top once
# a cert has been issued (step 8), without needing this file edited.
#
# Before use: replace www.clientlivedemo.shop below with your real domain —
# both here and in web.ssl.conf.example/web.ssl.conf once you copy it.

upstream web_upstream {
  least_conn;
  server web:80 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

server {
  listen 80;
  server_name www.clientlivedemo.shop clientlivedemo.shop;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  error_page 404 /error-pages/404.html;
  error_page 500 502 503 504 /error-pages/50x.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location ^~ /error-pages/ {
    root /usr/share/nginx/html;
    internal;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
