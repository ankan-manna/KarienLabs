# ============================================================
# MedCommerce API - Production HTTPS
# Domain: api.clientlivedemo.shop
# ============================================================

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name api.clientlivedemo.shop;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# HTTPS API
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name api.clientlivedemo.shop;

    # Let's Encrypt certificate
    ssl_certificate     /etc/nginx/certs/live/api.clientlivedemo.shop/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.clientlivedemo.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 5m;

    # --------------------------------------------------------
    # Let's Encrypt renewal
    # --------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # Health check
    # --------------------------------------------------------
    location = /health {
        proxy_pass http://api:5000/health;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------
    # API
    # --------------------------------------------------------
    location / {
        proxy_pass http://api:5000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
