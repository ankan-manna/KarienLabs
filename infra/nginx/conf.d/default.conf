upstream api_upstream {
  least_conn;
  server api:5000 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

upstream web_upstream {
  server web:80 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  client_max_body_size 5m;

  error_page 404 /error-pages/404.html;
  error_page 500 502 503 504 /error-pages/50x.html;
  location ^~ /error-pages/ {
    root /usr/share/nginx/html;
    internal;
  }

  # Tighter limit on auth endpoints specifically — the app itself locks an
  # account after 5 failed logins (see auth.service.ts), this is the
  # complementary edge-level throttle so a credential-stuffing burst never
  # even reaches the app layer.
  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
    limit_req zone=auth_limit burst=5 nodelay;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
