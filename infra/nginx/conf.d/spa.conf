# Used inside the apps/web image itself (static-only container behind the main nginx proxy).
server {
  listen 80;
  # Without this, the container's own HEALTHCHECK (`wget http://localhost/`
  # in apps/web/Dockerfile) can fail with "Connection refused" on any Docker
  # host where `localhost` resolves to ::1 before 127.0.0.1 (confirmed on
  # Docker Desktop) — nginx was only listening on IPv4, refusing the IPv6
  # loopback connection outright. Matches the dual-stack `listen 80;
  # listen [::]:80;` pattern this repo's other nginx configs already use
  # (see ssl.conf / web.ssl.conf.example).
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
