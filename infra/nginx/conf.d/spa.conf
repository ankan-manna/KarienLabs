# Used inside the apps/web image itself (static-only container behind the main nginx proxy).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
