# Local production-build QA only — NOT used in staging/production (those
# mount default.conf+ssl.conf / web.default.conf+web.ssl.conf instead, see
# docker-compose.prod.yml). No real domain exists on a laptop, so this
# collapses the two-subdomain split (api.<domain> / www.<domain>) down to a
# single catch-all server block, path-routed, plain HTTP — just enough to
# exercise the real nginx reverse-proxy + rate-limit config against the real
# production Docker images (api, web) end to end. See
# infra/docker/docker-compose.local-qa.yml.

upstream api_upstream {
  server api:5000;
}

upstream web_upstream {
  server web:80;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 5m;

  location = /health {
    proxy_pass http://api_upstream/health;
    proxy_set_header Host $host;
  }

  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
