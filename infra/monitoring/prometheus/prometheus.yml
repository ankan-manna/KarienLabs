global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics — request rate, latency histogram, Node.js process
  # stats (CPU/memory/event-loop lag/GC). See apps/api/src/middlewares/metrics.middleware.ts.
  - job_name: medcommerce-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]
        labels: { service: api }

  # Host-level CPU/memory/disk — see the node-exporter service in
  # docker-compose.monitoring.yml.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container CPU/memory/network for every service in the stack — see the
  # cadvisor service in docker-compose.monitoring.yml.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Prometheus's own self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # MongoDB metrics (queue depth, connections, replication lag) — requires the
  # mongodb-exporter sidecar, commented out until MONGO_URI/auth is wired to
  # it (percona/mongodb_exporter needs its own connection string).
  # - job_name: mongodb
  #   static_configs:
  #     - targets: ["mongodb-exporter:9216"]

  # Redis metrics (memory, connected clients, ops/sec, queue-adjacent key
  # counts for BullMQ) — requires the redis-exporter sidecar.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
